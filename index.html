<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   청년전세ON · 나의 전세임대 길잡이
  </title>
  <style id="embedded-site-style">
@font-face {
  font-family: 'Paperlogy';
  src: url('./Paperlogy-5Medium.ttf') format('truetype');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

* {
  box-sizing:border-box
}
body {
  margin:0;
  background:#f5f8fd;
  color:#233652;
  font-family:Paperlogy,sans-serif;
  font-weight:500;
  font-size:14px;
  line-height:1.6
}
button,input,select {
  font:inherit
}
button,a,input,select {
  outline-offset:4px
}
button {
  cursor:pointer
}
button {
  border:0;
  background:none;
  color:inherit
}
a {
  color:inherit
}
header {
  height:78px;
  background:#fff;
  border-bottom:1px solid #e2eaf6;
  display:flex;
  align-items:center;
  padding:0 38px;
  gap:60px
}
.logo {
  display:flex;
  gap:10px;
  align-items:center;
  white-space:nowrap
}
.logo strong {
  font-size:22px;
  color:#123c83
}
.logo small {
  display:block;
  font-size:10px;
  color:#8291aa;
  margin-top:-5px
}
.brand-icon {
  width:36px;
  height:40px;
  color:#1964ef
}
nav {
  display:flex;
  gap:30px;
  height:100%;
  align-items:center
}
nav button {
  height:100%;
  border-bottom:3px solid transparent;
  font-size:13px
}
nav button.active {
  color:#1761e9;
  border-color:#1761e9
}
.user {
  margin-left:auto;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:12px
}
.avatar {
  background:#eaf1ff;
  border-radius:50%;
  padding:7px 11px;
  color:#2765bf
}
.layout {
  max-width:1480px;
  margin:auto;
  display:grid;
  grid-template-columns:228px 1fr;
  min-height:calc(100vh - 78px)
}
aside {
  padding:32px 20px;
  border-right:1px solid #e5edf7;
  background:#fafdff
}
.side-intro {
  padding:0 10px 25px
}
.side-intro strong {
  font-size:16px
}
.muted {
  color:#76859d
}
.small {
  font-size:12px
}
.side-nav {
  display:grid;
  gap:9px
}
.side-nav button {
  text-align:left;
  padding:13px 12px;
  border-radius:8px;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:10px
}
.side-nav button span {
  width:20px;
  text-align:center;
  font-size:16px
}
.side-nav button.active {
  background:#2166ee;
  color:white;
  box-shadow:0 6px 12px #2166ee20
}
.side-nav button:hover:not(.active) {
  background:#eaf1fd
}
.side-promo {
  background:linear-gradient(145deg,#e7f2ff,#f3f9ff);
  margin-top:42px;
  border-radius:12px;
  padding:20px;
  color:#2461bd
}
.side-promo svg {
  width:100%;
  height:115px;
  margin-top:10px
}
main {
  padding:28px 36px 34px;
  min-width:0
}
.breadcrumb {
  font-size:11px;
  color:#8593aa;
  margin-bottom:16px
}
.intro {
  margin-bottom:24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}
h1 {
  font-size:25px;
  line-height:1.45;
  margin:0 0 7px;
  color:#143365;
  letter-spacing:-.8px
}
h2 {
  font-size:17px;
  line-height:1.5;
  margin:0 0 18px;
  color:#214579
}
h3 {
  font-size:14px;
  margin:0 0 10px
}
p {
  margin:5px 0 12px
}
.intro p {
  font-size:12px;
  color:#7587a2;
  margin:0
}
.blue {
  color:#1a64ef
}
.pill {
  display:inline-block;
  background:#eaf2ff;
  color:#2266d4;
  border-radius:20px;
  padding:4px 10px;
  font-size:10px;
  white-space:nowrap
}
.pill.green {
  background:#e4f7ef;
  color:#168362
}
.pill.orange {
  background:#fff2dc;
  color:#a96808
}
.card {
  background:#fff;
  border:1px solid #e4ecf8;
  border-radius:12px;
  padding:25px;
  box-shadow:0 4px 15px #193c7504
}
.grid2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px
}
.grid-main {
  display:grid;
  grid-template-columns:minmax(0,1fr) 245px;
  gap:20px
}
.hero {
  border-radius:14px;
  background:linear-gradient(110deg,#eaf3ff,#f7fbff);
  padding:26px 30px;
  margin-bottom:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden
}
.hero svg {
  width:195px;
  height:130px
}
.eyebrow {
  font-size:10px;
  letter-spacing:2px;
  color:#759acb;
  margin-bottom:7px
}
.steps {
  display:flex;
  gap:15px;
  font-size:11px;
  align-items:center;
  color:#91a0b5
}
.steps b {
  background:#eaf2ff;
  color:#2166ee;
  border-radius:50%;
  padding:5px 9px;
  margin-right:5px
}
.field {
  display:block;
  margin-bottom:17px
}
.field>span {
  display:block;
  font-size:12px;
  color:#4b6385;
  margin-bottom:7px
}
input,select {
  width:100%;
  border:1px solid #dce5f4;
  border-radius:7px;
  background:#fff;
  color:#284265;
  padding:10px 12px;
  min-width:0
}
input:focus,select:focus {
  border-color:#2469ef
}
.btn {
  border-radius:7px;
  background:#2166ee;
  color:white;
  padding:11px 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:12px;
  box-shadow:0 4px 9px #2166ee15
}
.btn:hover {
  background:#1454d0
}
.btn.secondary {
  background:#fff;
  color:#3467bd;
  border:1px solid #dae6fa;
  box-shadow:none
}
.btn.full {
  width:100%
}
.info {
  border-radius:8px;
  background:#eef5ff;
  padding:13px 15px;
  color:#607b9e;
  font-size:11px;
  margin-top:18px
}
.conditions {
  background:linear-gradient(160deg,#f5fbff,#edf5ff)
}
.keyrow {
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:16px 0;
  border-bottom:1px solid #dfeaf7;
  font-size:12px
}
.keyrow:last-child {
  border:0
}
.keyrow strong {
  color:#2056a4;
  text-align:right
}
.keyrow.big strong {
  font-size:22px;
  color:#1a64ef
}
.quick {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:20px
}
.quick button {
  text-align:left;
  background:#fff;
  border:1px solid #e4ecf8;
  padding:16px;
  border-radius:9px;
  color:#345a93;
  font-size:12px
}
.quick small {
  display:block;
  font-size:10px;
  color:#8694ab;
  margin-top:4px
}
.notice {
  font-size:11px;
  color:#7d8ca3;
  margin-top:24px;
  border-top:1px solid #e3ebf6;
  padding-top:15px
}
.result {
  background:#e7f8f1;
  border-radius:9px;
  padding:18px;
  color:#148262;
  margin-top:18px
}
.result.warn {
  background:#fff5e4;
  color:#9d650a
}
.result.bad {
  background:#fff0f2;
  color:#bb354c
}
.result strong {
  display:block;
  font-size:16px
}
.result p {
  font-size:11px;
  margin:5px 0 0
}
.summary {
  background:#f3f8ff;
  padding:18px;
  border-radius:8px;
  margin-top:20px
}
.summary .keyrow {
  padding:10px 0
}
.money {
  display:flex;
  align-items:center;
  gap:8px
}
.money input {
  text-align:right
}
.side-note {
  background:linear-gradient(145deg,#e8f3ff,#f7fbff);
  padding:22px;
  border-radius:12px;
  color:#3e6294;
  font-size:12px
}
.side-note svg {
  height:140px;
  width:100%
}
.side-note h3 {
  color:#205cae
}
.side-note li {
  margin-bottom:12px
}
ul {
  padding-left:19px
}
.table-wrap {
  overflow-x:auto
}
table {
  width:100%;
  border-collapse:collapse;
  font-size:12px
}
th {
  background:#f1f6fe;
  font-size:11px;
  color:#536d94;
  padding:12px;
  text-align:left
}
td {
  padding:12px;
  border-bottom:1px solid #eaf0f8
}
td select,td input {
  padding:7px;
  font-size:11px;
  min-width:105px
}
.tabs {
  display:flex;
  gap:6px;
  border-bottom:1px solid #e0e9f7;
  margin-bottom:20px
}
.tabs button {
  padding:12px 18px;
  font-size:12px;
  border-bottom:2px solid transparent
}
.tabs .active {
  color:#2166ee;
  border-color:#2166ee
}
.listing-head {
  display:grid;
  grid-template-columns:210px 1fr;
  gap:25px;
  margin-bottom:22px
}
.room {
  height:170px;
  background:linear-gradient(135deg,#edf3f3,#d5dfdc);
  border-radius:9px;
  overflow:hidden;
  position:relative
}
.room svg {
  width:100%;
  height:100%
}
.listing-head h2 {
  font-size:22px;
  margin:8px 0
}
.deadline {
  border:1px solid #ffdfeb;
  background:linear-gradient(110deg,#fff1f5,#fff9fc);
  border-radius:14px;
  padding:26px 30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:35px
}
.dday {
  font-size:54px;
  color:#ff4269;
  line-height:1.3
}
.progress {
  background:#e4dce5;
  border-radius:10px;
  height:7px;
  margin:15px 0
}
.progress i {
  display:block;
  background:#ff4a73;
  height:100%;
  border-radius:10px
}
.dates {
  display:flex;
  justify-content:space-between;
  font-size:11px;
  gap:12px
}
.metrics {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px
}
.metric {
  background:#f2f8ff;
  padding:20px 16px;
  border-radius:10px;
  font-size:12px
}
.metric strong {
  display:block;
  font-size:28px;
  color:#2065e5;
  margin-top:6px
}
.metric:nth-child(2) {
  background:#fff7ec
}
.metric:nth-child(3) {
  background:#f0f5ff
}
.metric:nth-child(4) {
  background:#edf9f4
}
.saved-row {
  padding:18px;
  background:white;
  border:1px solid #e4ecf8;
  border-radius:10px;
  margin-bottom:15px;
  display:grid;
  grid-template-columns:135px 1fr 175px;
  gap:20px;
  align-items:center
}
.saved-row .room {
  height:110px
}
.saved-row h3 {
  margin-bottom:3px
}
.track {
  display:flex;
  gap:5px;
  margin-top:15px
}
.track span {
  flex:1;
  height:5px;
  background:#dee6f1;
  border-radius:4px
}
.track span.done {
  background:#397bf3
}
.saved-actions {
  display:grid;
  gap:9px
}
.agent-banner {
  display:flex;
  gap:22px;
  align-items:center;
  padding-bottom:25px;
  border-bottom:1px solid #e6eef8;
  margin-bottom:25px
}
.agent-avatar {
  width:120px;
  height:120px;
  flex-shrink:0;
  border-radius:12px;
  background:#eaf3ff;
  display:grid;
  place-items:center
}
.agent-avatar svg {
  width:85px;
  height:85px
}
.agent-metrics {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px
}
.agent-metrics .metric {
  padding:17px 12px;
  font-size:10px
}
.empty {
  text-align:center;
  padding:40px;
  color:#8392a9
}
.hidden {
  display:none!important
}
dialog {
  border:1px solid #dae5f6;
  border-radius:16px;
  width:min(520px,90vw);
  padding:28px;
  color:#233652;
  font-family:inherit
}
dialog::backdrop {
  background:#12244760
}
.toast {
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 22px;
  background:#193b6c;
  color:white;
  border-radius:10px;
  font-size:12px;
  z-index:20
}
.screen {
  animation:enter .2s ease
}
@keyframes enter {
  from {
    opacity:.4;
    transform:translateY(5px)
  }
  to {
    opacity:1;
    transform:none
  }
}
@media(prefers-reduced-motion:reduce) {
  .screen {
    animation:none
  }
}
@media(min-width:1450px) {
  main {
    padding:34px 44px
  }
}
@media(max-width:1100px) {
  header {
    gap:30px;
    padding:0 24px
  }
  nav {
    gap:15px
  }
  .layout {
    grid-template-columns:190px 1fr
  }
  aside {
    padding:25px 12px
  }
  main {
    padding:25px 22px
  }
  .grid-main {
    grid-template-columns:1fr
  }
  .side-note {
    display:none
  }
  .steps {
    display:none
  }
  .saved-row {
    grid-template-columns:110px 1fr
  }
  .saved-actions {
    grid-column:2
  }
  .agent-metrics {
    grid-template-columns:repeat(3,1fr)
  }
}
@media(max-width:740px) {
  header {
    height:68px;
    padding:0 18px
  }
  .logo strong {
    font-size:19px
  }
  nav {
    display:none
  }
  .user {
    font-size:10px
  }
  .layout {
    display:block
  }
  aside {
    padding:12px;
    border-right:0;
    border-bottom:1px solid #e2eaf6
  }
  .side-intro,.side-promo {
    display:none
  }
  .side-nav {
    display:flex;
    overflow:auto;
    gap:6px
  }
  .side-nav button {
    white-space:nowrap;
    padding:9px 12px
  }
  .side-nav button span {
    display:none
  }
  main {
    padding:20px 16px
  }
  h1 {
    font-size:22px
  }
  .grid2 {
    grid-template-columns:1fr
  }
  .hero {
    padding:22px
  }
  .hero svg {
    width:100px;
    height:100px
  }
  .hero h1 {
    font-size:21px
  }
  .intro {
    align-items:flex-start
  }
  .intro .pill {
    display:none
  }
  .card {
    padding:20px
  }
  .quick {
    grid-template-columns:1fr
  }
  .deadline {
    grid-template-columns:1fr;
    gap:20px;
    padding:24px
  }
  .metrics {
    grid-template-columns:1fr 1fr
  }
  .listing-head {
    grid-template-columns:1fr
  }
  .room {
    height:190px
  }
  .saved-row {
    grid-template-columns:85px 1fr;
    gap:13px
  }
  .saved-row .room {
    height:90px
  }
  .saved-actions {
    grid-column:1/-1;
    grid-template-columns:1fr 1fr
  }
  .agent-banner {
    align-items:flex-start;
    gap:15px
  }
  .agent-avatar {
    width:65px;
    height:65px
  }
  .agent-avatar svg {
    width:50px;
    height:50px
  }
  .agent-metrics {
    grid-template-columns:1fr 1fr
  }
  .tabs button {
    padding:10px 12px
  }
  .dates {
    flex-wrap:wrap
  }
  .keyrow.big strong {
    font-size:20px
  }
}


/* ===== Home redesign 2026-10-07 ===== */

/* ===== Unified site system 2026-10-07 ===== */

/* One typography + one visual system across every route */
html{background:#f6f9fd}
body{
  background:#f6f9fd;
  color:#17233b;
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  font-weight:400;
  font-size:14px;
  line-height:1.65;
  letter-spacing:-.015em
}
button,input,select,textarea{font-family:inherit;font-weight:400}
h1,h2,h3,strong{font-weight:700}
h1{color:#14233d}
h2{color:#1d3659}
p{color:#667890}

/* Header follows the home screen everywhere */
header,
.home-mode header,
.service-mode header{
  position:sticky;
  top:0;
  z-index:30;
  width:100%;
  height:84px;
  padding:0 max(30px,calc((100vw - 1240px)/2));
  gap:34px;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid #e4ebf4;
  backdrop-filter:blur(12px)
}
.logo{gap:9px}
.logo strong,
.home-mode .logo strong,
.service-mode .logo strong{
  font-size:23px;
  letter-spacing:-.04em;
  color:#123f89
}
.logo small,
.home-mode .logo small,
.service-mode .logo small{display:none}
.brand-icon,
.home-mode .brand-icon{width:32px;height:36px;color:#1767df}
nav,
.home-mode nav,
.service-mode nav{
  margin-left:12px;
  gap:24px;
  height:100%
}
nav button,
.home-mode nav button,
.service-mode nav button{
  height:100%;
  padding:0 2px;
  font-size:13px;
  font-weight:600;
  color:#34445d;
  border-bottom:2px solid transparent
}
nav button:hover{color:#1761d8}
nav button.active{color:#1761d8;border-color:#1761d8}
.user .pill{display:none}
.avatar,
.home-mode .avatar,
.service-mode .avatar{
  border-radius:8px;
  padding:9px 14px;
  background:#f2f5f9;
  color:#44566f;
  font-weight:600
}

/* Retire the old dashboard sidebar so the inner pages feel like the home page */
.layout{
  display:block;
  max-width:none;
  min-height:calc(100vh - 84px)
}
aside{display:none}
main{
  width:100%;
  max-width:1240px;
  margin:0 auto;
  padding:30px 28px 46px;
  min-width:0
}
.home-mode main,.service-mode main{max-width:none;padding:0}
.breadcrumb{
  margin:0 0 18px;
  color:#8b99ac;
  font-size:11px
}
.screen{animation:enter .18s ease}

/* Inner-page opening area */
.hero{
  border:1px solid #e3eaf4;
  border-radius:12px;
  background:linear-gradient(120deg,#f7faff,#eef5fd);
  padding:28px 32px;
  margin-bottom:20px;
  box-shadow:none
}
.hero h1{font-size:26px;letter-spacing:-1px}
.hero svg{width:165px;height:110px}
.eyebrow{color:#6780a4;letter-spacing:.13em}

/* Headings and content cards use the same calm geometry as the home dashboard */
.intro{
  margin-bottom:18px;
  padding:2px 2px 0
}
.intro h1{font-size:27px;line-height:1.35;letter-spacing:-1px}
.intro p{font-size:13px;color:#718197}
.intro>.pill{border-radius:6px;background:#f0f5fb;color:#48678f;padding:6px 10px}

.card,
.saved-row,
.side-note,
.deadline{
  border:1px solid #e2e9f3;
  border-radius:12px;
  background:#fff;
  box-shadow:none
}
.card{padding:26px}
.card h2{font-size:17px;letter-spacing:-.35px}
.conditions{background:#f7faff}
.side-note{
  background:#f7faff;
  color:#536b89
}
.side-note h3{color:#274f85}
.info,.summary{
  border:1px solid #e1e9f4;
  border-radius:8px;
  background:#f4f8fd;
  color:#607793
}

/* Forms and controls */
.field>span{color:#52677f;font-size:12px;font-weight:600}
input,select{
  min-height:42px;
  border:1px solid #dbe4ef;
  border-radius:7px;
  color:#263b58;
  background:#fff
}
input:focus,select:focus{
  border-color:#1767df;
  box-shadow:0 0 0 3px rgba(23,103,223,.08)
}
.btn{
  border-radius:7px;
  background:#1767df;
  color:#fff;
  font-weight:600;
  box-shadow:none
}
.btn:hover{background:#1058c5}
.btn.secondary{
  background:#fff;
  border:1px solid #cddcf0;
  color:#245b9f
}
.pill{
  border-radius:6px;
  background:#eef4fb;
  color:#41658f;
  font-weight:600
}
.pill.green{background:#edf8f4;color:#16795e}
.pill.orange{background:#fff5e9;color:#a3650f}

/* Tabs, tables and saved items */
.tabs{gap:18px;border-color:#e1e8f2}
.tabs button{
  padding:11px 2px;
  font-weight:600;
  color:#6d7d91
}
.tabs .active{color:#1761d8;border-color:#1761d8}
.table-wrap,.saved-row{background:#fff}
table{font-size:12px}
th{
  background:#f6f9fd;
  color:#536983;
  font-weight:700
}
td{border-color:#e8edf4}
.saved-row{padding:20px;margin-bottom:12px}
.room{border-radius:8px}
.track span.done{background:#1767df}

/* D-day screen: remove the old pink theme so it belongs to this site */
.deadline{
  background:#f7faff;
  border-color:#e1e9f4
}
.dday{color:#1767df}
.progress{background:#e1e8f2}
.progress i{background:#1767df}
.metrics{gap:12px}
.metric,
.metric:nth-child(2),
.metric:nth-child(3),
.metric:nth-child(4){
  border:1px solid #e2e9f3;
  border-radius:9px;
  background:#f7faff;
  color:#50647e
}
.metric strong{color:#1767df}

/* Agent page */
.agent-banner{border-color:#e3e9f1}
.agent-avatar{border-radius:10px;background:#eef5fd}
.agent-metrics .metric{background:#f7faff}

/* Home photo: show the approved image without chopping off its contents */
.home-hero{grid-template-columns:1.16fr .84fr}
.home-visual{
  background-color:#f3f8fc;
  background-image:url('hero-city-clean.jpg');
  background-repeat:no-repeat;
  background-position:center bottom;
  background-size:contain
}

/* Service page uses the submitted artwork itself, not a recreated version */
.service-mode{background:#f6f9fd}
.service-image-page{max-width:1040px;margin:0 auto;padding:34px 28px 58px}
.service-image-head{
  padding:25px 28px;
  margin-bottom:16px;
  border:1px solid #e2e9f3;
  border-radius:10px;
  background:#fff
}
.service-image-head h1{font-size:27px;color:#14233d}
.service-original-art{
  display:block;
  width:min(100%,760px);
  height:auto;
  margin:0 auto;
  border:0;
  background:#fff;
  box-shadow:0 10px 30px rgba(31,63,105,.05)
}

/* Footer is consistent on every page */
.notice,
.home-mode .notice,
.service-mode .notice{
  max-width:1240px;
  margin:22px auto 0;
  padding:16px 28px 26px;
  border-top:1px solid #e3eaf3;
  color:#8997aa;
  font-size:10px
}

/* Mobile */
@media(max-width:1080px){
  header,.home-mode header,.service-mode header{padding:0 22px;gap:20px}
  nav,.home-mode nav,.service-mode nav{gap:14px}
  nav button,.home-mode nav button,.service-mode nav button{font-size:12px}
  main{padding:24px 20px 40px}
  .home-hero{grid-template-columns:1fr 1fr}
}
@media(max-width:800px){
  header,.home-mode header,.service-mode header{height:68px;padding:0 16px}
  nav,.home-mode nav,.service-mode nav{display:none}
  main{padding:18px 14px 34px}
  .hero{padding:22px}
  .hero svg{width:105px;height:88px}
  .intro h1{font-size:23px}
  .grid2,.grid-main{grid-template-columns:1fr}
  .service-image-page{padding:18px 12px 36px}
  .service-image-head{padding:21px 18px}
  .service-original-art{width:100%}
  .home-hero{grid-template-columns:1fr}
  .home-visual{min-height:300px;order:-1}
}


/* ===== Eligibility simulator 2026-10-07 ===== */

/* Render uploaded images as actual image elements, not CSS re-creations */
.home-visual{
  min-height:430px;
  overflow:hidden;
  background:#eef5fb;
  display:flex;
  align-items:stretch;
  justify-content:stretch
}
.home-visual-img{
  display:block;
  width:100%;
  height:100%;
  min-height:430px;
  object-fit:cover;
  object-position:center
}
.service-original-art{
  display:block;
  width:min(100%,941px);
  height:auto;
  object-fit:contain
}

/* My conditions / pre-application simulation */
.condition-page{display:grid;gap:18px}
.condition-heading{
  padding:28px 32px;
  border:1px solid #e2e9f3;
  border-radius:12px;
  background:linear-gradient(120deg,#fff,#f4f8fd)
}
.condition-heading h1{
  margin:4px 0 8px;
  font-size:31px;
  line-height:1.3;
  letter-spacing:-1.25px
}
.condition-heading p{margin:0;font-size:13px;color:#708096}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  margin-bottom:20px
}
.section-head>div{display:flex;align-items:center;gap:10px}
.section-head h2{margin:0}
.section-head p{margin:0;font-size:11px;color:#8491a4}
.section-no{
  display:inline-grid;
  place-items:center;
  width:28px;height:28px;
  border-radius:7px;
  background:#edf4fd;
  color:#1767df;
  font-size:11px;
  font-weight:700

.simulation-card{padding:28px 30px}

  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-bottom:20px
}
.sim-qualifiers .field{
  margin:0;
  padding:15px;
  border:1px solid #e2e9f3;
  border-radius:9px;
  background:#f9fbfd

.sim-qualifiers .field>span{min-height:39px;line-height:1.5}
.asset-groups{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
.asset-group{
  border:1px solid #e2e9f3;
  border-radius:10px;
  padding:18px;
  background:#fff
}
.asset-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.asset-title h3{margin:0;color:#223c5f;font-size:14px}
.asset-title span{font-size:10px;color:#8a97a9;text-align:right}
.asset-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.asset-field span{
  display:block;
  margin-bottom:5px;
  color:#53677f;
  font-size:11px;
  font-weight:600
}
.asset-field>div{position:relative}
.asset-field input{padding-right:45px;text-align:right}
.asset-field em{
  position:absolute;
  right:12px;

  transform:translateY(-50%);

  font-style:normal;
  color:#8b98a9
}
.sim-calc-btn{margin-top:18px;width:100%;min-height:46px}
.simulation-result{

  padding:20px;
  border:1px solid #dce7f5;
  border-radius:10px;
  background:#f4f8fd

.simulation-result.good{background:#eff8f5;border-color:#d6eee5}
.simulation-result.bad{background:#fff5f5;border-color:#f1dfe1}
.sim-rank-label{font-size:10px;color:#7d8ca0;margin-bottom:3px}
.simulation-result>strong{display:block;font-size:25px;color:#1767df}
.simulation-result.good>strong{color:#13775d}

.compact-page{gap:16px}

.summary-tile{
  display:flex;

  min-height:112px;

.feature-disclosure{

  background:#fff;
  overflow:hidden
}

.feature-disclosure>summary{
  list-style:none;
  display:flex;
  align-items:center;

  gap:18px;
  min-height:86px;
  padding:18px 22px;

}

.feature-disclosure>summary>div{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0
}
.feature-disclosure>summary>div>span:last-child{
  display:flex;
  flex-direction:column;
  min-width:0
}
.feature-disclosure>summary strong{
  color:#203b5f;
  font-size:14px
}

  margin-top:4px;

  font-size:10.5px;
  line-height:1.5
}
.feature-disclosure>summary>b{
  flex:none;

  border-radius:7px;
  background:#f0f5fb;
  color:#315f98;
  font-size:10.5px;

}
.feature-disclosure>summary>b:after{content:"  +" }
.feature-disclosure[open]>summary{
  border-bottom:1px solid #e6edf5;
  background:#f8fbff
}
.feature-disclosure[open]>summary>b:after{content:"  −"}

  return `<select name="${name}"><option value="unknown" ${value==='unknown'?'selected':''}>확인 필요</option><option value="yes" ${value==='yes'?'selected':''}>예</option><option value="no" ${value==='no'?'selected':''}>아니오</option></select>`;
}
function simAssetFields(prefix,a){
  const items=[['deposit','예금'],['stock','주식·펀드'],['car','자동차'],['rentalDeposit','임차보증금'],['realEstate','부동산'],['debt','부채']];

}

}

      <tr><td>전세보증금</td><td>최대 ${money(max())}</td><td>${money(selected.price)}</td><td>${badge(selected.price>max()?'미충족':selected.price>state.profile.limit?'추가부담':'충족')}</td></tr>
      <tr><td>전용면적</td><td>${areaMax()}㎡ 이하</td><td><input aria-label="전용면적 제곱미터" id="check-area" type="number" min="0.1" max="10000" step="0.1" value="${state.check.area}"></td><td id="area-status"></td></tr>
      <tr><td>주택유형</td><td>자료상 지원 주택</td><td><select aria-label="주택유형" data-check="type">${opt(['단독','다가구','다세대','연립','아파트','주거용 오피스텔','근린생활시설','확인 필요'],state.check.type)}</select></td><td id="type-status"></td></tr>
      ${[['move','전입신고','가능해야 함'],['rights','제한권리','등기사항 확인 필요'],['consent','임대인 동의','LH 계약방식 동의']].map(([k,n,c])=>`<tr><td>${n}</td><td>${c}</td><td><select aria-label="${n}" data-check="${k}">${opt(k==='rights'?['확인 필요','제한권리 없음','제한권리 있음']:['확인 필요','예','아니오'],state.check[k])}</select></td><td id="${k}-status"></td></tr>`).join('')}
    </tbody></table></div>
    <div id="check-result" aria-live="polite"></div>${official}
  </div>
</details>`:`${header('사용자 조건에 따른 매물 확인','지역·보증금·주택유형을 선택한 뒤 매물을 비교해 보세요.')}
<form id="listing-search-form" class="listing-search-bar">
  <label class="field"><span>지역</span><select name="region">${opt(['전체','서울특별시','경기도','인천광역시'],state.search.region)}</select></label>
  <label class="field"><span>주택유형</span><select name="type">${opt(['전체','다가구','다세대','연립','아파트','주거용 오피스텔'],state.search.type)}</select></label>
  <label class="field"><span>최대 보증금</span><div class="listing-price-input"><input name="maxPrice" type="number" min="0" step="100" value="${state.search.maxPrice}" placeholder="예: 15000"><em>만원</em></div></label>
  <button class="btn" type="submit">조건 적용</button>
</form>
<div class="listing-results-head"><div><span class="section-no">01</span><div><h2>조건에 맞는 매물</h2><p>시연용 예시 매물입니다. 원하는 매물을 선택하면 상세 조건을 확인할 수 있습니다.</p></div></div><span class="pill">${items.length}건</span></div>
<div class="listing-card-grid">
${items.map(x=>`<article class="listing-card">
  ${room}
  <div class="listing-card-body"><span class="pill">${esc(x.type)}</span><h3>${esc(x.name)}</h3><p>${esc(x.address)}</p><div class="listing-card-meta"><span>전세 <strong>${money(x.price)}</strong></span><span>전용 ${x.area}㎡</span></div><button class="btn secondary full" data-select-listing="${x.id}">이 매물 확인하기 →</button></div>
</article>`).join('')||'<div class="card empty">선택한 조건에 맞는 예시 매물이 없습니다. 조건을 조금 넓혀보세요.</div>'}
</div>`},
saved:()=>`${header('나의 매물','관심매물은 바로 확인하고, 진행상태를 한눈에 관리하세요.')}
<div class="page-summary-grid three">
  <div class="summary-tile"><span>전체 매물</span><strong>${state.properties.length}건</strong><small>등록된 관심매물</small></div>
  <div class="summary-tile"><span>진행 중</span><strong>${state.properties.filter(x=>!['계약 완료','반려'].includes(x.stage)).length}건</strong><small>현재 확인 중</small></div>
  <div class="summary-tile"><span>완료</span><strong>${state.properties.filter(x=>x.stage==='계약 완료').length}건</strong><small>계약 완료</small></div>
</div>
<div class="saved-section-head">
  <div><span class="section-no">01</span><div><h2>관심매물</h2><p>등록한 매물과 진행상태를 바로 확인할 수 있습니다.</p></div></div>
  <button class="btn" id="add-property">＋ 매물 등록</button>
</div>
<div class="tabs saved-tabs" aria-label="매물 필터">${['전체','진행 중','완료','반려'].map(x=>`<button class="${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div>
<div class="saved-list">
${state.properties.filter(x=>filter==='전체'||filter==='완료'&&x.stage==='계약 완료'||filter==='반려'&&x.stage==='반려'||filter==='진행 중'&&!['계약 완료','반려'].includes(x.stage)).map(x=>`<article class="saved-row">${room}<div><h3>${esc(x.name)}</h3><strong class="blue small">전세 ${money(x.price)}</strong><p class="small muted">${esc(x.address)}</p><span class="pill ${x.stage==='계약 완료'?'green':x.stage==='반려'?'orange':''}">${x.stage}</span><div class="track" aria-hidden="true">${Array.from({length:6},(_,i)=>`<span class="${i<=({'관심매물':0,'중개사 문의':1,'임대인 동의 확인':2,'권리분석 요청':3,'보완 요청':3,'승인':4,'반려':3,'계약 완료':5}[x.stage])?'done':''}"></span>`).join('')}</div></div><div class="saved-actions"><select aria-label="${esc(x.name)} 진행상태" data-stage="${x.id}">${opt(stages,x.stage)}</select><button class="btn secondary" data-load="${x.id}">이 매물 조건 확인 →</button><button class="small muted" data-delete="${x.id}">목록에서 삭제</button></div></article>`).join('')||'<div class="card empty">해당 상태의 매물이 없습니다.</div>'}
</div>`,
agent:()=>{const agents=[
  {name:'행복부동산 공인중개사사무소',area:'광진구 자양동',deals:12,rights:18,years:'전세임대 4년',tag:'계약 경험 다수'},
  {name:'청년주거 부동산',area:'광진구 화양동',deals:9,rights:14,years:'전세임대 3년',tag:'청년전세 상담'},
  {name:'온하우스 공인중개사사무소',area:'성동구 성수동',deals:8,rights:11,years:'전세임대 3년',tag:'권리분석 경험'},
  {name:'한걸음 공인중개사사무소',area:'동대문구 장안동',deals:6,rights:10,years:'전세임대 2년',tag:'임대인 협의 경험'}
];return `${header('공인중개사 찾기','전세임대 경험이 있는 중개업소를 여러 곳 비교해 보세요.')}
<div class="agent-intro-row">
  <div><span class="section-no">01</span><div><h2>전세임대 경험 중개사</h2><p>아래 정보는 기능 시연을 위한 예시 데이터입니다.</p></div></div>
  <span class="pill">총 ${agents.length}곳</span>
</div>
<div class="agent-card-grid">
${agents.map((a,i)=>`<article class="agent-card">
  <div class="agent-card-top">
    <div class="agent-avatar"><svg class="blue"><use href="#brand"/></svg></div>
    <div><span class="pill ${i===0?'orange':''}">${a.tag}</span><h3>${a.name}</h3><p>${a.area}</p></div>
  </div>
  <div class="agent-card-stats">
    <div><span>실제 계약 성사</span><strong>${a.deals}<small>건</small></strong></div>
    <div><span>권리분석 진행</span><strong>${a.rights}<small>건</small></strong></div>
  </div>
  <div class="agent-card-foot"><span>${a.years}</span></div>
  <details class="agent-detail">
    <summary>상세 보기</summary>
    <div class="agent-card-detail">
      <div class="keyrow"><span>집계기간</span><strong>예시 데이터</strong></div>
      <div class="keyrow"><span>주요 경험</span><strong>${a.tag}</strong></div>
      <div class="keyrow"><span>증빙자료</span><strong>실제 서비스 연동 시 확인 예정</strong></div>
    </div>
  </details>
</article>`).join('')}
</div>
<div class="info agent-note">실제 서비스에서는 검증된 실적, 지역, 상담 가능 여부 등을 기준으로 비교할 수 있도록 설계하는 방향입니다.</div>`}
};
function badge(v){return `<span class="pill ${v==='충족'?'green':v==='미충족'||v==='추가부담'||v==='확인 필요'?'orange':''}">${v}</span>`}
function calcResult(){const extra=Math.max(0,state.price-state.profile.limit),bad=state.price>max();return `<div class="summary"><h3 class="blue">계산 결과</h3><div class="keyrow"><span>최대 허용 전세금</span><strong>${money(max())}</strong></div><div class="keyrow"><span>매물 전세보증금</span><strong>${money(state.price)}</strong></div><div class="keyrow big"><span>지원한도 초과분</span><strong style="color:${extra?'#ed4f67':'#1a64ef'}">${money(extra)}</strong></div></div><div class="result ${bad?'bad':''}"><strong>${bad?'전세금 허용범위를 초과합니다.':extra?'추가부담 허용범위 이내입니다.':'지원한도 이내입니다.'}</strong><p>${bad?'허용범위보다 '+money(state.price-max())+' 높습니다. 전세금 조정 또는 다른 매물을 검토하세요.':extra?'한도 초과분의 본인 부담 가능 여부와 나머지 매물 조건을 확인하세요.':'면적·권리관계·임대인 동의 등 나머지 조건도 확인해 주세요.'}</p></div><p class="small muted" style="margin-top:12px">위 금액은 지원한도 초과분만 계산합니다. 기본 임대보증금과 기타 비용을 합한 총 자기부담금은 아닙니다.</p>`}
function checkResult(){const c=state.check,ar=Number(c.area);

const vals={area:!Number.isFinite(ar)||ar<=0?'확인 필요':ar>areaMax()?'미충족':'충족',type:c.type==='근린생활시설'?'미충족':['확인 필요','주거용 오피스텔'].includes(c.type)?'확인 필요':'충족',move:c.move==='예'?'충족':c.move==='아니오'?'미충족':'확인 필요',rights:c.rights==='제한권리 없음'?'충족':c.rights==='제한권리 있음'?'미충족':'확인 필요',consent:c.consent==='예'?'충족':c.consent==='아니오'?'미충족':'확인 필요'};Object.entries(vals).forEach(([k,v])=>$('#'+k+'-status').innerHTML=badge(v));

const fail=state.price>max()||Object.values(vals).includes('미충족');

$('#check-result').innerHTML=`<div class="result ${fail?'bad':'warn'}"><strong>${fail?'현재 입력 기준 미충족 항목이 있습니다.':'확인 필요 · 공식 권리분석 전 단계입니다.'}</strong><p>${fail?'표에 표시된 미충족 항목을 확인하고 조건 조정 또는 보완 가능 여부를 문의하세요.':'확인되지 않은 항목을 먼저 확인해 주세요.'} 주택가격·선순위 보증금·소유관계·임대인 제한사항은 이 화면에서 검증하지 않으므로 계약 가능 여부를 확정하지 않습니다.${c.type==='주거용 오피스텔'?' 오피스텔은 난방·취사·화장실 등 주거용 시설 확인도 필요합니다.':''}</p></div>`}
function go(p){if(!titles[p])return;page=p;history.replaceState(null,'','#'+p);render();

window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function bind(){if(page==='home'){document.querySelectorAll('.home-recent [data-load]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const x=state.properties.find(v=>String(v.id)===b.dataset.load);if(!x)return;selectProperty({id:'S'+x.id,name:x.name,address:x.address,price:x.price,area:'',type:'확인 필요',move:'확인 필요',rights:'확인 필요',consent:'확인 필요'});go('check')})}if(page==='profile'){
const f=$('#profile-form'),sf=$('#simulation-form');
['region','people'].forEach(n=>f.elements[n].addEventListener('change',()=>{f.elements.limit.value='';$('#limit-help').textContent='변경한 지역·입주인원에 해당하는 선정통보의 지원한도를 입력해 주세요.'}));
f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(d.deadline<d.selected){toast('계약기한은 선정일 이후로 입력해 주세요.');return}d.limit=Number(d.limit);state.profile={...state.profile,...d};save();render();toast('지원정보를 저장했습니다.')};
sf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(sf));const read=(prefix,key)=>assetNum(d[prefix+'_'+key]);const keys=['deposit','stock','car','rentalDeposit','realEstate','debt'];state.simulation.firstRank=d.firstRank;state.simulation.familyIncome100=d.familyIncome100;state.simulation.selfIncome100=d.selfIncome100;keys.forEach(k=>{state.simulation.self[k]=read('self',k);state.simulation.parents[k]=read('parents',k)});save();$('#simulation-result').innerHTML=simulationResultHtml();toast('모의계산 결과를 반영했습니다.')};
}if(page==='calc')$('#calc-form').onsubmit=e=>{e.preventDefault();state.price=Number(new FormData(e.target).get('price'));save();

$('#calc-result').innerHTML=calcResult()};if(page==='check'){
if(state.selectedProperty){
  checkResult();
  $('#check-area').oninput=e=>{state.check.area=e.target.value;state.selectedProperty.area=e.target.value;save();checkResult()};
  document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.check[el.dataset.check]=el.value;state.selectedProperty[el.dataset.check]=el.value;save();checkResult()});
  $('#back-to-listings').onclick=()=>{state.selectedProperty=null;save();render()};
}else{
  const f=$('#listing-search-form');
  f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));state.search={region:d.region,type:d.type,maxPrice:d.maxPrice};save();render()};
  document.querySelectorAll('[data-select-listing]').forEach(b=>b.onclick=()=>{const x=listingInventory.find(v=>v.id===b.dataset.selectListing);if(!x)return;selectProperty(x);render();toast(x.name+'을 선택했습니다.')});
}}if(page==='saved'){$('#add-property').onclick=()=>$('#modal').showModal();

document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});

document.querySelectorAll('[data-stage]').forEach(el=>el.onchange=()=>{state.properties.find(x=>String(x.id)===el.dataset.stage).stage=el.value;save();render();toast('진행상태를 저장했습니다.')});

document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 관심매물을 목록에서 삭제할까요?')){state.properties=state.properties.filter(x=>String(x.id)!==b.dataset.delete);save();render()}});

document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const x=state.properties.find(v=>String(v.id)===b.dataset.load);if(!x)return;selectProperty({id:'S'+x.id,name:x.name,address:x.address,price:x.price,area:'',type:'확인 필요',move:'확인 필요',rights:'확인 필요',consent:'확인 필요'});go('check');toast(x.name+'의 상세 조건을 확인합니다.')})}}
$('#close-modal').onclick=()=>$('#modal').close();

$('#add-form').onsubmit=e=>{e.preventDefault();

const d=Object.fromEntries(new FormData(e.target));if(!d.name.trim()||!d.address.trim()){toast('매물 이름과 주소를 입력해 주세요.');return}state.properties.push({id:Date.now(),name:d.name.trim(),address:d.address.trim(),price:Number(d.price),stage:'관심매물'});save();

$('#modal').close();e.target.reset();filter='전체';render();toast('관심매물을 등록했습니다.')};

window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(titles[p]){page=p;render()}});page=titles[location.hash.slice(1)]?location.hash.slice(1):'home';render();

</script>
 </body>
</html>
