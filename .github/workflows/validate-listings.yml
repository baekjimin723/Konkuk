name: Validate property listing status

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: validate-property-listings
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Validate listing source pages
        run: python scripts/validate_listings.py

      - name: Commit refreshed status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add living-area-site/index.html living-area-site/listing-status.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-validate live property listings"
            git push
          fi
