name: Sync and validate property listings

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: validate-property-listings
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Sync listing inventory
        run: python scripts/sync_daangn_listings.py

      - name: Validate listing source pages
        run: python scripts/validate_listings.py

      - name: Commit refreshed status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add living-area-site/index.html living-area-site/listing-status.json living-area-site/sync-status.json
          if git diff --cached --quiet; then
            echo "No main-branch changes."
          else
            git commit -m "Auto-sync and validate live property listings"
            git push origin main
          fi

      - name: Publish refreshed inventory to Pages branch
        run: |
          git fetch origin choonsikkk-repo-fix
          git checkout choonsikkk-repo-fix
          git checkout main -- living-area-site/index.html living-area-site/listing-status.json living-area-site/sync-status.json
          git add living-area-site/index.html living-area-site/listing-status.json living-area-site/sync-status.json
          if git diff --cached --quiet; then
            echo "Pages branch already current."
          else
            git commit -m "Publish refreshed live property inventory"
            git push origin choonsikkk-repo-fix
          fi
