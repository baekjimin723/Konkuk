name: Discover shared housing with browser

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/discover_shared_housing_browser.py"
      - ".github/workflows/discover-shared-housing.yml"
  schedule:
    - cron: "13 */6 * * *"

permissions:
  contents: write

concurrency:
  group: discover-shared-housing
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright requests beautifulsoup4 pillow
          python -m playwright install --with-deps chromium

      - name: Discover rendered shared-housing places
        run: python scripts/discover_shared_housing_browser.py

      - name: Refresh shared-housing inventory
        run: python scripts/sync_shared_housing.py

      - name: Cache shared-housing photos
        run: python scripts/cache_listing_images.py

      - name: Commit refreshed shared housing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add living-area-site/shared-place-ids.json living-area-site/shared-housing-status.json living-area-site/image-cache-status.json living-area-site/index.html living-area-site/assets/listings
          if git diff --cached --quiet; then
            echo "No shared-housing changes."
          else
            git commit -m "Auto-discover shared housing across the 90-minute area"
            git push origin main
          fi

      - name: Publish shared housing to Pages branch
        run: |
          git fetch origin choonsikkk-repo-fix
          git checkout choonsikkk-repo-fix
          git checkout main -- living-area-site/shared-place-ids.json living-area-site/shared-housing-status.json living-area-site/image-cache-status.json living-area-site/index.html living-area-site/assets/listings
          git add living-area-site/shared-place-ids.json living-area-site/shared-housing-status.json living-area-site/image-cache-status.json living-area-site/index.html living-area-site/assets/listings
          if git diff --cached --quiet; then
            echo "Pages branch already current."
          else
            git commit -m "Publish discovered shared housing"
            git push origin choonsikkk-repo-fix
          fi
