name: Harvest real listing photos

on:
  push:
    branches:
      - choonsikkk-repo-fix
    paths:
      - ".github/workflows/harvest-listing-photos.yml"
      - "scripts/scrape_listing_photos.py"

permissions:
  contents: write

jobs:
  harvest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: choonsikkk-repo-fix
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "selenium>=4.26" "Pillow>=10.4"

      - name: Verify Chrome
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Extract real property photos
        run: python scripts/scrape_listing_photos.py

      - name: Commit harvested photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add living-area-site/assets/listings
          if git diff --cached --quiet; then
            echo "No photo changes to commit"
          else
            git commit -m "실매물 실제 사진 자동 수집"
            git push origin HEAD:choonsikkk-repo-fix
          fi
