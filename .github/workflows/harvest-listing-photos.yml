name: Harvest real listing photos

on:
  push:
    branches:
      - choonsikkk-repo-fix
    paths:
      - ".github/workflows/harvest-listing-photos.yml"
      - "scripts/scrape_listing_photos.py"

concurrency:
  group: harvest-listing-photos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: choonsikkk-repo-fix
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "selenium>=4.26" "Pillow>=10.4" "requests>=2.32"

      - name: Verify Chrome
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Extract real property photos
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        run: python scripts/scrape_listing_photos.py

      - name: Upload shard photos
        uses: actions/upload-artifact@v4
        with:
          name: listing-photos-${{ matrix.shard }}
          path: living-area-site/assets/listings
          if-no-files-found: warn
          retention-days: 1

  merge:
    needs: harvest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: choonsikkk-repo-fix
          fetch-depth: 0

      - name: Download all photo shards
        uses: actions/download-artifact@v4
        with:
          pattern: listing-photos-*
          path: living-area-site/assets/listings
          merge-multiple: true

      - name: Build photo manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("living-area-site/assets/listings")
          jpgs=sorted(p.glob("*.jpg"))
          merged={f.stem:f"assets/listings/{f.name}" for f in jpgs}
          (p/"photos.js").write_text("window.LISTING_PHOTOS="+json.dumps(merged,ensure_ascii=False,separators=(",",":"))+";\n",encoding="utf-8")
          (p/"scrape-summary.json").write_text(json.dumps({"total":len(jpgs),"saved":len(jpgs),"failed":0,"manifest":len(merged),"source":"jpg inventory"},ensure_ascii=False,indent=2),encoding="utf-8")
          print({"jpgs":len(jpgs),"manifest":len(merged)})
          PY

      - name: Commit harvested photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add living-area-site/assets/listings
          if git diff --cached --quiet; then
            echo "No photo changes to commit"
          else
            git commit -m "실매물 실제 사진 자동 수집"
            git push origin HEAD:choonsikkk-repo-fix
          fi
