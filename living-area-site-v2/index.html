<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>생활권ON v5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#263a55;font-family:Arial,'Noto Sans KR',sans-serif}header{background:#fff;border-bottom:1px solid #e1e8f2;padding:18px 24px;position:sticky;top:0;z-index:10}.brand{font-size:22px;font-weight:800;color:#174a92}.build{margin-top:4px;font-size:12px;color:#e05a47;font-weight:700}
.wrap{max-width:1440px;margin:0 auto;padding:22px}.panel{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:20px;margin-bottom:16px}.panel h2{margin:0 0 6px;font-size:18px}.sub{font-size:12px;color:#7d8ca1;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label,.title{display:block;font-size:12px;font-weight:800;margin-bottom:6px}select,input{width:100%;height:42px;border:1px solid #d9e2ee;border-radius:9px;padding:0 10px;background:#fff}
.multi{grid-column:1/-1}.multi-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.mini{border:1px solid #d9e2ee;background:#fff;border-radius:8px;padding:6px 8px;font-size:11px}.choices{display:flex;gap:7px;flex-wrap:wrap;max-height:180px;overflow:auto;border:1px solid #dfe7f1;border-radius:10px;padding:10px;background:#fbfdff}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:block;padding:8px 10px;border:1px solid #dfe7f1;border-radius:999px;font-size:11px;background:#fff}.choice input:checked+span{background:#eaf2ff;border-color:#1761e9;color:#1761e9;font-weight:700}.selected{margin-top:6px;color:#75869d;font-size:11px}
.budget{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;height:44px;background:#1761e9;color:#fff;border:0;border-radius:10px;font-weight:800;margin-top:12px}.applied{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.applied span{background:#fff;border:1px solid #dfe7f1;border-radius:9px;padding:8px 10px;font-size:12px}.applied b{color:#1761e9}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:15px}.loc{font-size:11px;color:#7c8ca0}.card h3{margin:5px 0 8px;font-size:16px}.price{font-size:20px;color:#1761e9;font-weight:900}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.tag{font-size:10px;background:#f1f5f9;border-radius:999px;padding:5px 7px}.source{font-size:10px;color:#6f8197}.link{display:block;margin-top:10px;text-align:center;background:#1761e9;color:#fff;text-decoration:none;border-radius:8px;padding:9px;font-size:11px;font-weight:800}.empty{background:#fff;border:1px dashed #cfd9e5;border-radius:12px;padding:20px}.portal{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.portal a{border:1px solid #d8e2ee;background:#fff;border-radius:8px;padding:8px 10px;text-decoration:none;color:#315f98;font-size:11px}
@media(max-width:900px){.grid,.cards{grid-template-columns:1fr}} 
</style>
</head>

<header><div class="brand">생활권ON</div><div class="build">NEW FILTER BUILD 2026-11-02 · v5</div></header>
<main class="wrap">
<section class="panel">
<h2>매물 조건</h2><div class="sub">시·군·구와 동·읍·면은 복수선택 가능합니다. 검색 버튼은 form 제출이 아니어서 선택값이 초기화되지 않습니다.</div>
<div class="grid">
<div class="field"><label>1. 시·도</label><select id="province"><option value="경기도">경기</option><option value="서울특별시">서울</option><option value="인천광역시">인천</option></select></div>
<div class="field"><label>2. 통근시간</label><select id="time"><option value="45">45분</option><option value="60">60분</option><option value="75">75분</option><option value="90" selected>90분</option></select></div>
<div class="multi"><div class="multi-head"><span class="title">3. 시·군·구</span><div><button class="mini" id="areaAll" type="button">전체선택</button> <button class="mini" id="areaClear" type="button">해제</button></div></div><div class="choices" id="areas"></div><div class="selected" id="areaText"></div></div>
<div class="multi"><div class="multi-head"><span class="title">4. 동·읍·면</span><div><button class="mini" id="dongAll" type="button">전체선택</button> <button class="mini" id="dongClear" type="button">해제</button></div></div><div class="choices" id="dongs"></div><div class="selected" id="dongText"></div></div>
<div class="field"><label>5. 주택유형</label><select id="type"><option value="전체">전체</option><option>단독·다가구</option><option>다세대·빌라</option><option>도시형생활주택</option><option>오피스텔</option><option>아파트</option></select></div>
<div class="field"><label>6. 방 구조</label><select id="layout"><option value="전체">전체</option><option>원룸</option><option>1.5룸</option><option>투룸</option><option>쓰리룸</option></select></div>
<div class="field"><label>7. 평수</label><select id="size"><option value="전체">전체</option><option value="s">6평 이하</option><option value="m">6~10평</option><option value="l">10~15평</option><option value="xl">15평 이상</option></select></div>
<div class="field"><label>8. 환승 횟수</label><select id="transfer"><option value="0">0회</option><option value="1">1회</option><option value="2" selected>2회</option><option value="3">3회</option></select></div>
<div class="multi"><span class="title">9. 보증금·월세</span><div class="budget"><input id="dep" type="number" value="1000" min="0" step="100" placeholder="보증금 최대"><input id="rent" type="number" value="60" min="0" step="5" placeholder="월세 최대"></div></div>
</div>
<button id="search" type="button" class="btn">선택한 조건으로 실제 매물 보기</button>
</section>
<div id="applied" class="applied"></div>
<section id="results"></section>
</main>

const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
function selAreas(){return qsa('#areas input:checked').map(x=>x.value)}
function selDongs(){return qsa('#dongs input:checked').map(x=>x.value)}
function renderAreas(){
 const p=qs('#province').value;
 qs('#areas').innerHTML=areaOptions[p].map(v=>'<label class="choice"><input type="checkbox" value="'+v+'"><span>'+v+'</span></label>').join('');
 renderDongs();
 updateTexts();
}
function renderDongs(){
 const selected=selAreas();
 const prev=new Set(selDongs());
 let rows=[];
 selected.forEach(city=>(dongOptions[city]||[]).forEach(d=>rows.push([city,d])));
 qs('#dongs').innerHTML=rows.length?rows.map(([city,d])=>{const v=city+'|||'+d;return '<label class="choice"><input type="checkbox" value="'+v+'" '+(prev.has(v)?'checked':'')+'><span>'+(selected.length>1?city+' · ':'')+d+'</span></label>'}).join(''):'<span style="font-size:11px;color:#7d8ca1">시·군·구를 먼저 선택하세요.</span>';
 updateTexts();
}
function updateTexts(){
 const a=selAreas(),d=selDongs();
 qs('#areaText').textContent=a.length?'선택: '+a.join(', '):'선택 없음 → 해당 시·도 전체';
 qs('#dongText').textContent=d.length?'선택: '+d.map(v=>v.split('|||')[1]).join(', '):'동 선택 없음 → 선택한 시·군·구 전체';
}
function band(py){return py<=6?'s':py<=10?'m':py<=15?'l':'xl'}
function cityDongMatch(l){
 const a=selAreas(),d=selDongs();
 const areaOk=!a.length||a.includes(l.city);
 const dongOk=!d.length||d.includes(l.city+'|||'+l.dong);
 return areaOk&&dongOk;
}
function search(){
 const state={province:qs('#province').value,time:+qs('#time').value,transfer:+qs('#transfer').value,type:qs('#type').value,layout:qs('#layout').value,size:qs('#size').value,dep:+qs('#dep').value,rent:+qs('#rent').value,areas:selAreas(),dongs:selDongs()};
 const out=listings.filter(l=>l.province===state.province&&cityDongMatch(l)&&l.time<=state.time&&l.transfer<=state.transfer&&(state.type==='전체'||l.type===state.type)&&(state.layout==='전체'||l.layout===state.layout)&&(state.size==='전체'||band(l.py)===state.size)&&l.dep<=state.dep&&l.rent<=state.rent);
 qs('#applied').innerHTML='<span>시·도 <b>'+qs('#province option:checked').textContent+'</b></span><span>시·군·구 <b>'+(state.areas.join(', ')||'전체')+'</b></span><span>동·읍·면 <b>'+(state.dongs.length?state.dongs.map(v=>v.split('|||')[1]).join(', '):'전체')+'</b></span><span>통근 <b>'+state.time+'분</b></span><span>환승 <b>'+state.transfer+'회 이하</b></span><span>예산 <b>'+state.dep.toLocaleString()+'/'+state.rent+' 이하</b></span>';
 if(out.length){
  qs('#results').innerHTML='<div class="cards">'+out.map(l=>'<article class="card"><div class="loc">'+l.province+' › '+l.city+' › '+l.dong+'</div><h3>'+l.layout+' · '+l.py+'평</h3><div class="price">'+l.dep.toLocaleString()+' / '+l.rent+'</div><div class="meta"><span class="tag">'+l.type+'</span><span class="tag">통근 '+l.time+'분</span><span class="tag">환승 '+l.transfer+'회</span></div><div class="source">'+l.source+' · '+l.note+'</div><a class="link" href="'+l.url+'" target="_blank" rel="noopener">실매물 사진·원문 보기</a></article>').join('')+'</div>';
 } else {
  const loc=[qs('#province option:checked').textContent,...state.areas,state.dongs.map(v=>v.split('|||')[1])].join(' ');
  const q=encodeURIComponent(loc+' 월세 원룸 투룸 다세대 다가구 오피스텔 아파트');
  qs('#results').innerHTML='<div class="empty"><b>현재 수집 카드 중 이 조건과 일치하는 매물이 없습니다.</b><div style="margin-top:6px;font-size:12px;color:#71829a">선택값은 유지됐고, 아래에서 같은 지역의 현재 매물을 바로 확인할 수 있습니다.</div><div class="portal"><a target="_blank" href="https://realty.daangn.com/">당근부동산</a><a target="_blank" href="https://land.naver.com/">네이버부동산</a><a target="_blank" href="https://www.zigbang.com/">직방</a><a target="_blank" href="https://www.dabangapp.com/map">다방</a><a target="_blank" href="https://www.peterpanz.com/">피터팬</a><a target="_blank" href="https://www.google.com/search?q='+q+'">통합검색</a></div></div>';
 }
}
qs('#province').addEventListener('change',renderAreas);
qs('#areas').addEventListener('change',renderDongs);
qs('#dongs').addEventListener('change',updateTexts);
qs('#areaAll').addEventListener('click',()=>{qsa('#areas input').forEach(x=>x.checked=true);renderDongs()});
qs('#areaClear').addEventListener('click',()=>{qsa('#areas input').forEach(x=>x.checked=false);renderDongs()});
qs('#dongAll').addEventListener('click',()=>{qsa('#dongs input').forEach(x=>x.checked=true);updateTexts()});
qs('#dongClear').addEventListener('click',()=>{qsa('#dongs input').forEach(x=>x.checked=false);updateTexts()});
qs('#search').addEventListener('click',search);
renderAreas();search();
</script>
